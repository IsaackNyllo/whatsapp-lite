<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bolinha</title>
<link rel="stylesheet" href="bubble.css">
</head>
<body>
<div id="ball" title="Clique para abrir · arraste para mover · botão direito: opções">
  <svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
  <span id="badge"></span>
</div>
<div id="card">
  <div class="top">
    <img id="avatar" alt="">
    <div class="text"><div id="name"></div><div id="msg"></div></div>
    <button id="close" title="Fechar">×</button>
  </div>
  <button id="reply">Responder</button>
  <input id="answer" placeholder="Escreva e aperte Enter" autocomplete="off">
</div>
<div id="notice">
  <div class="top">
    <img id="nIcon" alt="">
    <i id="nWarn">!</i>
    <div class="text"><div id="nTitle"></div><div id="nText"></div></div>
    <button id="nClose" title="Fechar">×</button>
  </div>
</div>
<div id="opts">
  <div class="title">Opções da bolinha</div>
  <div>
    <div class="label">Cor da bolinha</div>
    <input id="hue" type="range" min="0" max="360" value="140" aria-label="Escolher cor">
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="row"><span>Contador de não lidas</span><button class="switch" role="switch" data-k="count" aria-label="Contador de não lidas"></button></div>
  <div class="row"><span>Prévia das mensagens</span><button class="switch" role="switch" data-k="preview" aria-label="Prévia das mensagens"></button></div>
  <div class="row"><span>Som ao avisar</span><button class="switch" role="switch" data-k="sound" aria-label="Som ao avisar"></button></div>
  <div id="secBox">
    <div class="label"><span>Prévia na tela por</span><span class="val" id="secVal"></span></div>
    <input id="sec" type="range" min="1" max="60" aria-label="Segundos da prévia">
  </div>
  <button type="button" id="done">Pronto</button>
</div>
<script src="bubble.js"></script>
</body>
</html>
